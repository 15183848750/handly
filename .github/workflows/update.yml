name: Daily Stock Update

on:
  schedule:
    # 北京时间 15:30 = UTC 07:30, 周一到周五
    - cron: '30 7 * * 1-5'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run pipeline
        run: python scripts/update.py
        continue-on-error: true

      - name: Commit changes
        run: |
          git config user.name "Handly Bot"
          git config user.email "bot@handly.cc"
          git add js/data.js js/signals.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "📊 数据更新 $(TZ='Asia/Shanghai' date +'%m-%d %H:%M')"
            git push
          fi
