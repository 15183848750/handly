<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>支付成功 — Handly Store</title>
<style>
:root { --bg: #f5f5f5; --text: #1a1a1a; --muted: #777; --accent: #e53935; --green: #2e7d32; }
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: var(--bg); color: var(--text); line-height: 1.6;
  display: flex; align-items: center; justify-content: center; min-height: 100vh;
}
.card {
  background: #fff; border-radius: 12px; padding: 48px 40px; text-align: center;
  box-shadow: 0 4px 24px rgba(0,0,0,.08); max-width: 440px; width: 90%;
}
.icon { font-size: 4rem; margin-bottom: 16px; }
h1 { font-size: 1.5rem; color: var(--green); margin-bottom: 8px; }
p { color: var(--muted); margin-bottom: 8px; font-size: 0.9rem; }
.order-id { background: #f5f5f5; padding: 8px 16px; border-radius: 6px; font-family: monospace; font-size: 0.85rem; margin: 16px 0; }
.actions { margin-top: 24px; display: flex; gap: 12px; flex-direction: column; }
.btn {
  display: block; padding: 12px 24px; border-radius: 8px; text-decoration: none;
  font-weight: 600; font-size: 0.95rem; transition: all .15s;
}
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: #c62828; }
.btn-secondary { color: var(--accent); border: 1.5px solid var(--accent); }
.btn-secondary:hover { background: #fff5f5; }
</style>
</head>
<body>
<div class="card">
  <div class="icon">✅</div>
  <h1>支付成功！</h1>
  <p>感谢您在 Handly Store 购物</p>
  <div class="order-id">订单号：HS-<span id="order-id">202505070001</span></div>
  <p style="font-size:0.85rem;">订单确认邮件已发送至您的邮箱<br>我们将尽快为您发货</p>
  <div class="actions">
    <a href="/" class="btn btn-primary">继续购物</a>
    <a href="/terms.html" class="btn btn-secondary">查看订单帮助</a>
  </div>
</div>
<script>
document.getElementById('order-id').textContent = 'HS-' + Date.now().toString(36).toUpperCase();
</script>
</body>
</html>
