<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Handly Stock — 智能选股</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a href="/" class="logo">Handly<span>Stock</span></a>
    <div class="search-wrap">
      <input type="text" class="search-input" id="searchInput" placeholder="搜索股票代码或名称..." autocomplete="off">
      <div class="search-dropdown" id="searchDropdown"></div>
    </div>
    <div class="update-time" id="updateTime">数据加载中...</div>
  </div>
</header>

<nav class="tabs">
  <div class="tabs-inner">
    <button class="tab active" data-tab="signals">信号选股</button>
    <button class="tab" data-tab="limitup">涨停板</button>
    <button class="tab" data-tab="all">全市场扫描</button>
  </div>
</nav>

<main>
  <!-- 信号选股 Tab -->
  <section id="tab-signals" class="tab-content active">
    <div class="section-header">
      <h2>🔥 强势推荐</h2>
      <span class="badge strong" id="strongBuyCount">0</span>
    </div>
    <div class="signal-grid" id="strongBuyGrid"></div>

    <div class="section-header">
      <h2>📈 买入关注</h2>
      <span class="badge buy" id="buyCount">0</span>
    </div>
    <div class="signal-grid" id="buyGrid"></div>

    <div class="section-header">
      <h2>👀 观察列表</h2>
      <span class="badge watch" id="watchCount">0</span>
    </div>
    <div class="signal-grid" id="watchGrid"></div>
  </section>

  <!-- 涨停板 Tab -->
  <section id="tab-limitup" class="tab-content">
    <div class="section-header">
      <h2>今日涨停板</h2>
      <span class="badge" id="limitUpCount">0</span>
    </div>
    <div class="table-wrap">
      <table class="data-table" id="limitUpTable">
        <thead>
          <tr>
            <th>代码</th><th>名称</th><th>现价</th><th>涨幅</th><th>连板</th>
            <th>封板资金</th><th>炸板</th><th>首次封板</th><th>行业</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <!-- 全市场 Tab -->
  <section id="tab-all" class="tab-content">
    <div class="section-header">
      <h2>综合排名 TOP 50</h2>
    </div>
    <div class="table-wrap">
      <table class="data-table" id="topTable">
        <thead>
          <tr>
            <th>代码</th><th>名称</th><th>现价</th><th>涨跌%</th><th>评分</th>
            <th>信号</th><th>买入区</th><th>止盈</th><th>止损</th>
            <th>理由</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </section>
</main>

<!-- 股票详情弹窗 -->
<div class="modal-overlay" id="detailOverlay">
  <div class="modal-container" id="detailModal">
    <div class="modal-header">
      <div class="modal-title-area">
        <span class="modal-stock-code" id="detailCode"></span>
        <span class="modal-stock-name" id="detailName"></span>
        <span class="modal-stock-price" id="detailPrice"></span>
        <span class="modal-stock-change" id="detailChange"></span>
      </div>
      <button class="modal-close" id="detailClose">&times;</button>
    </div>
    <div class="modal-tabs" id="detailTabs">
      <button class="modal-tab active" data-dtab="finance">财务</button>
      <button class="modal-tab" data-dtab="kline">K线图</button>
      <button class="modal-tab" data-dtab="ai">AI分析</button>
      <button class="modal-tab" data-dtab="backtest">回测</button>
    </div>
    <div class="modal-body">
      <!-- 财务 Tab -->
      <div class="detail-panel active" id="panel-finance">
        <div class="finance-grid" id="financeGrid"></div>
      </div>
      <!-- K线图 Tab -->
      <div class="detail-panel" id="panel-kline">
        <div class="chart-container" id="klineChart"></div>
        <div class="chart-container chart-volume" id="volumeChart"></div>
      </div>
      <!-- AI分析 Tab -->
      <div class="detail-panel" id="panel-ai">
        <div class="ai-cards" id="aiCards"></div>
      </div>
      <!-- 回测 Tab -->
      <div class="detail-panel" id="panel-backtest">
        <div class="backtest-controls">
          <label class="bt-label">策略：</label>
          <select class="bt-select" id="btStrategy">
            <option value="default">默认策略：评分>40买入，跌破止损卖出</option>
            <option value="ma_cross">均线金叉买入，均线死叉卖出</option>
          </select>
          <label class="bt-label">阈值：</label>
          <input type="number" class="bt-input" id="btThreshold" value="40" min="0" max="100">
          <button class="bt-run" id="btRun">运行回测</button>
        </div>
        <div class="backtest-results" id="btResults">
          <div class="bt-metrics" id="btMetrics"></div>
          <div class="chart-container" id="btChart"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<footer>
  <p>数据来源：东方财富 ｜ 更新时间：<span id="footerTime">--</span> ｜ 仅供参考，不构成投资建议</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<script src="js/data.js?v=3"></script>
<script src="js/app.js?v=3"></script>
<div id="debugBar" style="position:fixed;bottom:0;left:0;right:0;background:#1a1d27;border-top:1px solid #2a2d38;padding:4px 12px;font-size:0.7rem;font-family:monospace;color:#787b86;z-index:9999;max-height:80px;overflow-y:auto"></div>
<script>
// 内联调试 —— 直接内嵌，不受缓存影响
(function(){
  var dbg = document.getElementById('debugBar');
  function dlog(msg){ dbg.innerHTML += '['+new Date().toLocaleTimeString()+'] '+msg+'<br>'; dbg.scrollTop=dbg.scrollHeight; }
  dlog('app.js?v=3 加载点');
  var _origOpenDetail = null;
  var _patchTimer = setInterval(function(){
    if (typeof openDetail === 'function' && !_origOpenDetail) {
      _origOpenDetail = openDetail;
      openDetail = function(code, name) {
        dlog('openDetail('+code+', '+name+')');
        _origOpenDetail(code, name);
      };
      dlog('openDetail 已挂载调试钩子');
    }
    if (typeof getDetailData === 'function') {
      // Hook getDetailData
    }
  }, 200);
})();
</script>
</body>
</html>
